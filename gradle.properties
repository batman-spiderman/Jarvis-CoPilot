# Project-wide Gradle settings.

# AndroidX package structure — required since every dependency in this
# project (Compose, Room, WorkManager, lifecycle, activity, etc.) is an
# AndroidX artifact. Without this, checkDebugAarMetadata fails.
android.useAndroidX=true

# Faster incremental builds — resolves each library into its own R class
# instead of one giant transitive R class. Safe default for new projects.
android.nonTransitiveRClass=true

# Speeds up build performance (parallel task execution, on-demand config).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Kotlin code style used by the Kotlin Gradle plugin (cosmetic only).
kotlin.code.style=official